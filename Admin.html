<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Koseli Collections</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { navy: '#142B3B', gold: '#D6A85F', offwhite: '#F8F8F6', charcoal: '#20252B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style> body { font-family: 'Inter', sans-serif; background-color: #F8F8F6; } .hidden { display: none !important; } </style>
</head>
<body class="text-charcoal antialiased min-h-screen">

    <!-- Login Screen -->
    <div id="loginView" class="fixed inset-0 bg-navy flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gold/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="lock" class="w-8 h-8 text-navy"></i>
                </div>
                <h1 class="text-2xl font-bold text-navy">Admin Login</h1>
                <p class="text-gray-500 text-sm mt-2">Koseli Collections Management</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="adminPassword" class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:outline-none focus:border-navy" placeholder="Enter admin password" onkeypress="if(event.key==='Enter') login()">
                </div>
                <div id="loginError" class="hidden text-red-500 text-sm text-center font-medium bg-red-50 p-2 rounded-md"></div>
                <button onclick="login()" id="loginBtn" class="w-full bg-navy text-white py-3 rounded-lg font-bold hover:bg-[#0d1e29] transition-colors">Login</button>
                <div class="text-center mt-4">
                    <a href="/" class="text-sm text-gray-500 hover:text-navy underline">Back to Store</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardView" class="hidden pb-20">
        <header class="bg-navy text-white sticky top-0 z-40 shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gold rounded-sm flex items-center justify-center text-navy font-bold text-xl">K</div>
                    <span class="font-bold text-xl text-gold">Koseli Admin</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="fetchOrders()" class="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-lg text-sm font-medium hover:bg-white/20 transition">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh
                    </button>
                    <button onclick="exportToExcel()" class="flex items-center gap-2 bg-gold text-navy px-4 py-2 rounded-lg text-sm font-bold hover:bg-[#c4984c] transition">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Export to Excel
                    </button>
                    <button onclick="logout()" class="flex items-center gap-2 bg-red-500/80 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-600 transition">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8">
            <!-- Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                    <p class="text-sm text-gray-500 font-medium mb-1">Total Orders</p>
                    <p class="text-2xl font-bold text-navy" id="statTotal">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-yellow-400">
                    <p class="text-sm text-gray-500 font-medium mb-1">Pending</p>
                    <p class="text-2xl font-bold text-yellow-600" id="statPending">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-green-500">
                    <p class="text-sm text-gray-500 font-medium mb-1">Delivered</p>
                    <p class="text-2xl font-bold text-green-600" id="statDelivered">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-blue-400">
                    <p class="text-sm text-gray-500 font-medium mb-1">Revenue</p>
                    <p class="text-2xl font-bold text-navy" id="statRevenue">Rs. 0</p>
                </div>
            </div>

            <!-- Orders Grid -->
            <h2 class="text-xl font-bold text-navy mb-4">Live Orders</h2>
            <div id="loading" class="text-center py-10 hidden">
                <div class="inline-block w-8 h-8 border-4 border-gray-200 border-t-navy rounded-full animate-spin"></div>
                <p class="mt-2 text-gray-500 text-sm">Loading orders...</p>
            </div>
            <div id="emptyState" class="hidden text-center py-16 bg-white rounded-xl border border-gray-200">
                <i data-lucide="inbox" class="w-12 h-12 text-gray-400 mx-auto mb-3"></i>
                <p class="text-gray-500 font-medium">No orders yet</p>
                <p class="text-gray-400 text-sm">New orders will appear here automatically.</p>
            </div>
            <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <script>
        // YOUR GOOGLE APPS SCRIPT URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzZmqrhmcUT1bCEVESUbHVrCGJaru8isRIKaYjlcD2O1MWPAP8Sjhjqrc4brqxz08_-/exec"; 
        let adminPassword = "admin123";
        let allOrders = [];

        function login() {
            const passwordInput = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!passwordInput) { 
                errorDiv.textContent = "Please enter password"; 
                errorDiv.classList.remove('hidden'); 
                return; 
            }
            
            loginBtn.textContent = "Verifying...";
            loginBtn.disabled = true;
            errorDiv.classList.add('hidden');

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                body: JSON.stringify({ action: "verifyAdmin", password: passwordInput })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    adminPassword = passwordInput;
                    document.getElementById('loginView').classList.add('hidden');
                    document.getElementById('dashboardView').classList.remove('hidden');
                    fetchOrders();
                    lucide.createIcons();
                } else {
                    errorDiv.textContent = "Incorrect password. Please try again.";
                    errorDiv.classList.remove('hidden');
                }
            })
            .catch((err) => {
                console.error(err);
                errorDiv.textContent = "Connection error. Check your internet or Google Script deployment.";
                errorDiv.classList.remove('hidden');
            })
            .finally(() => {
                loginBtn.textContent = "Login";
                loginBtn.disabled = false;
            });
        }

        function logout() {
            adminPassword = "";
            allOrders = [];
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').classList.add('hidden');
        }

        function fetchOrders() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('ordersGrid').innerHTML = '';

            fetch(`${GAS_URL}?action=getOrders&password=${encodeURIComponent(adminPassword)}`)
                .then(res => res.json())
                .then(orders => {
                    document.getElementById('loading').classList.add('hidden');
                    allOrders = orders;
                    updateStats();
                    renderOrders();
                })
                .catch(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('emptyState').classList.remove('hidden');
                    document.getElementById('emptyState').innerHTML = '<p class="text-red-500">Failed to load orders.</p>';
                });
        }

        function updateStats() {
            const total = allOrders.length;
            const pending = allOrders.filter(o => o['Status'] === 'Pending Confirmation').length;
            const delivered = allOrders.filter(o => o['Status'] === 'Delivered').length;
            const revenue = allOrders.reduce((sum, o) => sum + (Number(o['Total']) || 0), 0);
            
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statDelivered').textContent = delivered;
            document.getElementById('statRevenue').textContent = `Rs. ${revenue.toLocaleString()}`;
        }

        function renderOrders() {
            const grid = document.getElementById('ordersGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (allOrders.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            grid.innerHTML = allOrders.reverse().map(order => {
                const status = order['Status'] || 'Pending Confirmation';
                let badgeColor = 'bg-yellow-100 text-yellow-800';
                if (status === 'Delivered') badgeColor = 'bg-green-100 text-green-800';
                if (status === 'Shipped') badgeColor = 'bg-blue-100 text-blue-800';
                if (status === 'Cancelled') badgeColor = 'bg-red-100 text-red-800';

                return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                    <div class="p-4 border-b border-gray-100 flex justify-between items-start">
                        <div>
                            <span class="font-mono font-bold text-navy text-lg">${order['Order Code']}</span>
                            <span class="ml-2 text-[10px] font-bold px-2 py-1 rounded ${badgeColor}">${status}</span>
                            <p class="text-xs text-gray-400 mt-1">${new Date(order['Date']).toLocaleString()}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-navy text-sm">${order['Customer Name']}</p>
                            <p class="text-xs text-gray-500">${order['Phone']}</p>
                        </div>
                    </div>
                    <div class="p-4 bg-offwhite flex-1">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Delivery Address</p>
                        <p class="text-sm text-charcoal mb-3">${order['Address']}</p>
                        <div class="border-t border-gray-200 pt-3">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Items</p>
                            <p class="text-sm text-charcoal">${order['Items']}</p>
                        </div>
                    </div>
                    <div class="p-4 border-t border-gray-200 bg-white flex justify-between items-center">
                        <span class="text-sm font-bold text-gray-500">Total</span>
                        <span class="text-lg font-bold text-gold">Rs. ${Number(order['Total']).toLocaleString()}</span>
                    </div>
                    <div class="px-4 pb-4 flex gap-2">
                        <a href="https://wa.me/977${order['Phone']}?text=Hello%20${order['Customer Name']},%20this%20is%20Koseli%20Collections.%20Your%20order%20${order['Order Code']}%20is%20being%20processed." target="_blank" class="flex-1 bg-[#25D366] text-white py-2 rounded-md text-sm font-bold text-center hover:bg-[#1da851] transition flex items-center justify-center gap-1">
                            <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp
                        </a>
                    </div>
                </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function exportToExcel() {
            if (allOrders.length === 0) { alert("No orders to export."); return; }
            
            const headers = ["Order Code", "Date", "Customer Name", "Phone", "Address", "Items", "Total", "Status"];
            const data = allOrders.map(o => headers.map(h => o[h] || ''));
            
            const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Orders");
            
            const now = new Date().toISOString().slice(0,10);
            XLSX.writeFile(wb, `Koseli_Orders_${now}.xlsx`);
        }
    </script>
</body>
</html>
