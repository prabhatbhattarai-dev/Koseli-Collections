<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Koseli Imports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#142B3B',
                        gold: '#D6A85F',
                        offwhite: '#F8F8F6',
                        charcoal: '#20252B',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F8F6; }
    </style>
</head>
<body class="text-charcoal antialiased min-h-screen pb-20">

    <!-- Admin Header -->
    <header class="bg-navy text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="/logo.png" alt="Logo" class="h-8 w-auto object-contain bg-white rounded p-1" onerror="this.style.display='none';">
                <span class="font-bold text-xl tracking-tight text-gold">Koseli Admin</span>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="location.reload()" class="text-sm font-medium hover:text-gold flex items-center gap-1 transition-colors">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh
                </button>
                <a href="/" class="bg-gold text-navy px-4 py-1.5 rounded-md text-sm font-bold hover:bg-[#c4984c] transition-colors">View Storefront</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                <p class="text-sm text-gray-500 font-medium mb-1">Total Orders</p>
                <p class="text-2xl font-bold text-navy" id="statTotal">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-yellow-400">
                <p class="text-sm text-gray-500 font-medium mb-1">Pending</p>
                <p class="text-2xl font-bold text-yellow-600" id="statPending">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-blue-400">
                <p class="text-sm text-gray-500 font-medium mb-1">Processing</p>
                <p class="text-2xl font-bold text-blue-600" id="statProcessing">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-orange-400">
                <p class="text-sm text-gray-500 font-medium mb-1">Shipped</p>
                <p class="text-2xl font-bold text-orange-600" id="statShipped">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-green-500">
                <p class="text-sm text-gray-500 font-medium mb-1">Delivered</p>
                <p class="text-2xl font-bold text-green-600" id="statDelivered">0</p>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="flex flex-wrap gap-2 mb-6">
            <button onclick="filterOrders('All')" class="filter-btn active bg-navy text-white px-4 py-2 rounded-md font-medium text-sm transition-colors">All Orders</button>
            <button onclick="filterOrders('Pending')" class="filter-btn bg-white text-charcoal border border-gray-300 px-4 py-2 rounded-md font-medium text-sm hover:bg-gray-50 transition-colors">Pending</button>
            <button onclick="filterOrders('Processing')" class="filter-btn bg-white text-charcoal border border-gray-300 px-4 py-2 rounded-md font-medium text-sm hover:bg-gray-50 transition-colors">Processing</button>
            <button onclick="filterOrders('Shipped')" class="filter-btn bg-white text-charcoal border border-gray-300 px-4 py-2 rounded-md font-medium text-sm hover:bg-gray-50 transition-colors">Shipped</button>
            <button onclick="filterOrders('Delivered')" class="filter-btn bg-white text-charcoal border border-gray-300 px-4 py-2 rounded-md font-medium text-sm hover:bg-gray-50 transition-colors">Delivered</button>
        </div>

        <!-- Orders Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6" id="ordersGrid">
            <!-- Orders injected via JS -->
        </div>
        
        <div id="emptyState" class="hidden text-center py-20 bg-white rounded-xl border border-gray-200 mt-6">
            <i data-lucide="inbox" class="w-12 h-12 text-gray-400 mx-auto mb-4"></i>
            <h3 class="text-lg font-bold text-navy mb-2">No orders found</h3>
            <p class="text-gray-500">There are no orders in this category right now.</p>
        </div>
    </main>

    <!-- Javascript -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // --- MOCK DATA (Generates only if empty so you can see how it looks) ---
        function generateMockData() {
            let orders = JSON.parse(localStorage.getItem('koseli_orders') || '[]');
            if (orders.length === 0) {
                const mockOrders = [
                    {
                        code: 'KI-8A4F2',
                        date: 'Oct 24, 2023 · 02:30 PM',
                        name: 'Suman Bhattarai',
                        phone: '9765566682',
                        address: 'Baneshwor, Kathmandu',
                        items: [
                            { name: 'Portable Bluetooth Speaker', qty: 1, price: 2800 },
                            { name: 'Fast Charging USB Cable', qty: 2, price: 350 }
                        ],
                        total: 3500,
                        status: 'Pending'
                    },
                    {
                        code: 'KI-3B9Q1',
                        date: 'Oct 24, 2023 · 11:15 AM',
                        name: 'Kripa Gautam',
                        phone: '9863263690',
                        address: 'Patan Dhoka, Lalitpur',
                        items: [
                            { name: 'Smart Watch Series 8', qty: 1, price: 4500 }
                        ],
                        total: 4500,
                        status: 'Processing'
                    },
                    {
                        code: 'KI-7X2L5',
                        date: 'Oct 23, 2023 · 04:45 PM',
                        name: 'Aashish Shrestha',
                        phone: '9841539527',
                        address: 'Boudha, Kathmandu',
                        items: [
                            { name: 'Ceramic Coffee Mug', qty: 3, price: 650 }
                        ],
                        total: 1950,
                        status: 'Delivered'
                    }
                ];
                localStorage.setItem('koseli_orders', JSON.stringify(mockOrders));
                return mockOrders;
            }
            return orders;
        }

        let allOrders = generateMockData();
        let currentFilter = 'All';

        function init() {
            updateStats();
            renderOrders();
            lucide.createIcons();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = allOrders.length;
            document.getElementById('statPending').innerText = allOrders.filter(o => o.status === 'Pending').length;
            document.getElementById('statProcessing').innerText = allOrders.filter(o => o.status === 'Processing').length;
            document.getElementById('statShipped').innerText = allOrders.filter(o => o.status === 'Shipped').length;
            document.getElementById('statDelivered').innerText = allOrders.filter(o => o.status === 'Delivered').length;
        }

        function renderOrders() {
            const grid = document.getElementById('ordersGrid');
            const emptyState = document.getElementById('emptyState');
            
            let filtered = allOrders;
            if (currentFilter !== 'All') {
                filtered = allOrders.filter(o => o.status === currentFilter);
            }

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(order => {
                let statusBadge = '';
                if (order.status === 'Pending') statusBadge = `<span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded">Pending</span>`;
                if (order.status === 'Processing') statusBadge = `<span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">Processing</span>`;
                if (order.status === 'Shipped') statusBadge = `<span class="bg-orange-100 text-orange-800 text-xs font-bold px-2 py-1 rounded">Shipped</span>`;
                if (order.status === 'Delivered') statusBadge = `<span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">Delivered</span>`;

                const itemsHtml = order.items.map(item => `
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-charcoal">${item.name} <span class="text-gray-500">x${item.qty}</span></span>
                        <span class="font-medium text-navy">Rs. ${(item.price * item.qty).toLocaleString()}</span>
                    </div>
                `).join('');

                // Action Buttons based on status
                let actionBtn = '';
                if (order.status === 'Pending') {
                    actionBtn = `<button onclick="updateStatus('${order.code}', 'Processing')" class="w-full bg-blue-600 text-white py-2 rounded-md text-sm font-bold hover:bg-blue-700 transition-colors">Mark as Processing</button>`;
                } else if (order.status === 'Processing') {
                    actionBtn = `<button onclick="updateStatus('${order.code}', 'Shipped')" class="w-full bg-orange-500 text-white py-2 rounded-md text-sm font-bold hover:bg-orange-600 transition-colors">Mark as Shipped</button>`;
                } else if (order.status === 'Shipped') {
                    actionBtn = `<button onclick="updateStatus('${order.code}', 'Delivered')" class="w-full bg-green-600 text-white py-2 rounded-md text-sm font-bold hover:bg-green-700 transition-colors">Mark as Delivered</button>`;
                } else {
                    actionBtn = `<div class="w-full bg-green-50 text-green-700 border border-green-200 py-2 rounded-md text-sm font-bold text-center flex items-center justify-center gap-1"><i data-lucide="check-circle" class="w-4 h-4"></i> Order Completed</div>`;
                }

                return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                    <!-- Card Header -->
                    <div class="p-4 border-b border-gray-100 flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-bold text-navy text-lg font-mono">${order.code}</span>
                                ${statusBadge}
                            </div>
                            <p class="text-sm text-gray-500">${order.date}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-navy">${order.name}</p>
                            <p class="text-sm text-gray-500">${order.phone}</p>
                        </div>
                    </div>

                    <!-- Order Details -->
                    <div class="p-4 bg-offwhite flex-1">
                        <div class="mb-3">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Delivery Address</p>
                            <p class="text-sm text-charcoal">${order.address}</p>
                        </div>
                        
                        <div class="border-t border-gray-200 pt-3">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Items Ordered</p>
                            ${itemsHtml}
                        </div>
                    </div>

                    <!-- Card Footer -->
                    <div class="p-4 border-t border-gray-200 bg-white">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm font-bold text-gray-500">Total Amount</span>
                            <span class="text-lg font-bold text-gold">Rs. ${order.total.toLocaleString()}</span>
                        </div>
                        <div class="flex gap-2">
                            <a href="https://wa.me/977${order.phone}?text=Hello%20${order.name},%20this%20is%20Koseli%20Imports.%20We%20are%20reviewing%20your%20order%20${order.code}." target="_blank" class="w-1/3 bg-[#25D366] text-white py-2 rounded-md text-sm font-bold hover:bg-[#1da851] transition-colors flex items-center justify-center gap-1">
                                <i data-lucide="message-circle" class="w-4 h-4"></i> Greet
                            </a>
                            <div class="w-2/3">
                                ${actionBtn}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        function filterOrders(status) {
            currentFilter = status;
            
            // Update Tab UI
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-navy', 'text-white');
                btn.classList.add('bg-white', 'text-charcoal', 'border', 'border-gray-300');
            });
            
            const clickedBtn = event.target;
            clickedBtn.classList.add('active', 'bg-navy', 'text-white');
            clickedBtn.classList.remove('bg-white', 'text-charcoal', 'border-gray-300');

            renderOrders();
        }

        function updateStatus(orderCode, newStatus) {
            // Update in memory
            const orderIndex = allOrders.findIndex(o => o.code === orderCode);
            if (orderIndex > -1) {
                allOrders[orderIndex].status = newStatus;
                // Update in local storage
                localStorage.setItem('koseli_orders', JSON.stringify(allOrders));
                // Re-render UI
                updateStats();
                renderOrders();
            }
        }

        init();
    </script>
</body>
</html>
