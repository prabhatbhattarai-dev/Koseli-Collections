<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Koseli Collections</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { navy: '#142B3B', gold: '#D6A85F', offwhite: '#F8F8F6', charcoal: '#20252B' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #F8F8F6; } 
        .hidden { display: none !important; } 
        /* Hide scrollbar for filter tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-charcoal antialiased min-h-screen">

    <!-- Login Screen -->
    <div id="loginView" class="fixed inset-0 bg-navy flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gold/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="lock" class="w-8 h-8 text-navy"></i>
                </div>
                <h1 class="text-2xl font-bold text-navy">Admin Login</h1>
                <p class="text-gray-500 text-sm mt-2">Koseli Collections Management</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="adminPassword" class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:outline-none focus:border-navy" placeholder="Enter admin password" onkeypress="if(event.key==='Enter') login()">
                </div>
                <div id="loginError" class="hidden text-red-500 text-sm text-center font-medium bg-red-50 p-2 rounded-md"></div>
                <button onclick="login()" id="loginBtn" class="w-full bg-navy text-white py-3 rounded-lg font-bold hover:bg-[#0d1e29] transition-colors">Login</button>
                <div class="text-center mt-4">
                    <a href="/" class="text-sm text-gray-500 hover:text-navy underline">Back to Store</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardView" class="hidden pb-20">
        
        <!-- Top Header -->
        <header class="bg-navy text-white sticky top-0 z-40 shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gold rounded-sm flex items-center justify-center text-navy font-bold text-xl">K</div>
                    <span class="font-bold text-xl text-gold">Koseli Admin</span>
                </div>
                <div class="flex items-center gap-2 md:gap-3">
                    <button onclick="fetchOrders()" class="flex items-center gap-2 bg-white/10 px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/20 transition">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i> <span class="hidden sm:inline">Refresh</span>
                    </button>
                    <button onclick="exportToExcel()" class="flex items-center gap-2 bg-gold text-navy px-3 py-2 rounded-lg text-sm font-bold hover:bg-[#c4984c] transition">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> <span class="hidden sm:inline">Export</span>
                    </button>
                    <button onclick="logout()" class="flex items-center gap-2 bg-red-500/80 px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-600 transition">
                        <i data-lucide="log-out" class="w-4 h-4"></i> <span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-3 md:px-6 py-6">
            
            <!-- Stats Overview -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                    <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Total Orders</p>
                    <p class="text-2xl font-bold text-navy" id="statTotal">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-yellow-400">
                    <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Pending</p>
                    <p class="text-2xl font-bold text-yellow-600" id="statPending">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-blue-400">
                    <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Processing</p>
                    <p class="text-2xl font-bold text-blue-600" id="statProcessing">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center border-b-4 border-b-green-500">
                    <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Delivered</p>
                    <p class="text-2xl font-bold text-green-600" id="statDelivered">0</p>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-2 mb-6 overflow-x-auto no-scrollbar flex gap-2">
                <button onclick="filterOrders('All', this)" class="filter-tab active flex-1 text-center px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap bg-navy text-white transition">
                    All <span class="bg-white/20 px-2 py-0.5 rounded-full ml-1 text-xs" id="count-all">0</span>
                </button>
                <button onclick="filterOrders('Pending Confirmation', this)" class="filter-tab flex-1 text-center px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap text-gray-600 hover:bg-gray-50 transition">
                    Pending <span class="bg-gray-100 px-2 py-0.5 rounded-full ml-1 text-xs" id="count-pending">0</span>
                </button>
                <button onclick="filterOrders('Processing', this)" class="filter-tab flex-1 text-center px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap text-gray-600 hover:bg-gray-50 transition">
                    Processing <span class="bg-gray-100 px-2 py-0.5 rounded-full ml-1 text-xs" id="count-processing">0</span>
                </button>
                <button onclick="filterOrders('Shipped', this)" class="filter-tab flex-1 text-center px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap text-gray-600 hover:bg-gray-50 transition">
                    Shipped <span class="bg-gray-100 px-2 py-0.5 rounded-full ml-1 text-xs" id="count-shipped">0</span>
                </button>
                <button onclick="filterOrders('Delivered', this)" class="filter-tab flex-1 text-center px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap text-gray-600 hover:bg-gray-50 transition">
                    Delivered <span class="bg-gray-100 px-2 py-0.5 rounded-full ml-1 text-xs" id="count-delivered">0</span>
                </button>
            </div>

            <!-- Orders Grid -->
            <div id="loading" class="text-center py-10 hidden">
                <div class="inline-block w-8 h-8 border-4 border-gray-200 border-t-navy rounded-full animate-spin"></div>
                <p class="mt-2 text-gray-500 text-sm">Loading orders...</p>
            </div>
            
            <div id="emptyState" class="hidden text-center py-16 bg-white rounded-xl border border-gray-200">
                <i data-lucide="inbox" class="w-12 h-12 text-gray-400 mx-auto mb-3"></i>
                <p class="text-gray-500 font-medium">No orders found</p>
                <p class="text-gray-400 text-sm">There are no orders with this status.</p>
            </div>
            
            <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
        </main>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzZmqrhmcUT1bCEVESUbHVrCGJaru8isRIKaYjlcD2O1MWPAP8Sjhjqrc4brqxz08_-/exec"; 
        let adminPassword = "";
        let allOrders = [];
        let currentFilter = "All";

        function login() {
            const passwordInput = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!passwordInput) { 
                errorDiv.textContent = "Please enter password"; 
                errorDiv.classList.remove('hidden'); 
                return; 
            }
            
            loginBtn.textContent = "Verifying...";
            loginBtn.disabled = true;
            errorDiv.classList.add('hidden');

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                body: JSON.stringify({ action: "verifyAdmin", password: passwordInput })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    adminPassword = passwordInput;
                    document.getElementById('loginView').classList.add('hidden');
                    document.getElementById('dashboardView').classList.remove('hidden');
                    fetchOrders();
                    lucide.createIcons();
                } else {
                    errorDiv.textContent = "Incorrect password. Please try again.";
                    errorDiv.classList.remove('hidden');
                }
            })
            .catch((err) => {
                errorDiv.textContent = "Connection error. Check your internet.";
                errorDiv.classList.remove('hidden');
            })
            .finally(() => {
                loginBtn.textContent = "Login";
                loginBtn.disabled = false;
            });
        }

        function logout() {
            adminPassword = "";
            allOrders = [];
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').classList.add('hidden');
        }

        function fetchOrders() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('ordersGrid').innerHTML = '';

            fetch(`${GAS_URL}?action=getOrders&password=${encodeURIComponent(adminPassword)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    
                    document.getElementById('loading').classList.add('hidden');
                    // The API returns newest at the bottom, so we reverse it to show newest at top
                    allOrders = data.reverse(); 
                    updateStats();
                    renderOrders();
                })
                .catch((err) => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('emptyState').classList.remove('hidden');
                    document.getElementById('emptyState').innerHTML = `<p class="text-red-500 font-bold">Error: ${err.message}</p>`;
                });
        }

        function updateStats() {
            const total = allOrders.length;
            const pending = allOrders.filter(o => o['Status'] === 'Pending Confirmation' || o['Status'] === 'Pending').length;
            const processing = allOrders.filter(o => o['Status'] === 'Processing').length;
            const delivered = allOrders.filter(o => o['Status'] === 'Delivered').length;
            
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statProcessing').textContent = processing;
            document.getElementById('statDelivered').textContent = delivered;

            // Update Tab Counts
            document.getElementById('count-all').textContent = total;
            document.getElementById('count-pending').textContent = pending;
            document.getElementById('count-processing').textContent = processing;
            document.getElementById('count-shipped').textContent = allOrders.filter(o => o['Status'] === 'Shipped').length;
            document.getElementById('count-delivered').textContent = delivered;
        }

        function filterOrders(status, btn) {
            currentFilter = status;
            
            // Update active tab styling
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('bg-navy', 'text-white');
                tab.classList.add('text-gray-600', 'hover:bg-gray-50');
                tab.querySelector('span').classList.remove('bg-white/20');
                tab.querySelector('span').classList.add('bg-gray-100');
            });
            
            btn.classList.remove('text-gray-600', 'hover:bg-gray-50');
            btn.classList.add('bg-navy', 'text-white');
            btn.querySelector('span').classList.remove('bg-gray-100');
            btn.querySelector('span').classList.add('bg-white/20');

            renderOrders();
        }

        function renderOrders() {
            const grid = document.getElementById('ordersGrid');
            const emptyState = document.getElementById('emptyState');
            
            let filtered = allOrders;
            if (currentFilter !== "All") {
                filtered = allOrders.filter(o => o['Status'] === currentFilter);
            }

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            grid.innerHTML = filtered.map(order => {
                const status = order['Status'] || 'Pending Confirmation';
                
                // Styling based on status
                let badgeColor = 'bg-yellow-100 text-yellow-800 border-yellow-200';
                let barColor = 'bg-yellow-400';
                if (status === 'Processing') { badgeColor = 'bg-blue-100 text-blue-800 border-blue-200'; barColor = 'bg-blue-400'; }
                if (status === 'Shipped') { badgeColor = 'bg-orange-100 text-orange-800 border-orange-200'; barColor = 'bg-orange-400'; }
                if (status === 'Delivered') { badgeColor = 'bg-green-100 text-green-800 border-green-200'; barColor = 'bg-green-500'; }
                if (status === 'Cancelled') { badgeColor = 'bg-red-100 text-red-800 border-red-200'; barColor = 'bg-red-500'; }

                // Format items
                let itemsHtml = '';
                if (order['Items']) {
                    const itemArray = order['Items'].split(' | ');
                    itemsHtml = itemArray.map(i => `<div class="text-sm text-gray-700 font-medium mb-1">• ${i}</div>`).join('');
                }

                // Format Date
                let dateStr = 'Unknown Date';
                try {
                    const d = new Date(order['Date']);
                    dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                } catch(e) {}

                // Format Phone
                const phone = order['Phone'] || '';
                const cleanPhone = phone.replace(/\D/g, '');

                // Action Buttons based on current status
                let actionBtn = '';
                if (status === 'Pending Confirmation' || status === 'Pending') {
                    actionBtn = `<button onclick="updateStatus('${order['Order Code']}', 'Processing')" class="w-full bg-navy text-white py-2 rounded-lg text-sm font-bold hover:bg-[#0d1e29] transition">Mark as Processing</button>`;
                } else if (status === 'Processing') {
                    actionBtn = `<button onclick="updateStatus('${order['Order Code']}', 'Shipped')" class="w-full bg-orange-500 text-white py-2 rounded-lg text-sm font-bold hover:bg-orange-600 transition">Mark as Shipped</button>`;
                } else if (status === 'Shipped') {
                    actionBtn = `<button onclick="updateStatus('${order['Order Code']}', 'Delivered')" class="w-full bg-green-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-green-700 transition">Mark as Delivered</button>`;
                } else {
                    actionBtn = `<div class="w-full bg-gray-100 text-gray-500 py-2 rounded-lg text-sm font-bold text-center border border-gray-200">✓ Order Completed</div>`;
                }

                return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1.5 ${barColor}"></div>
                    
                    <div class="p-4 md:p-5 flex-1 flex flex-col">
                        <!-- Header -->
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="inline-block bg-gray-100 text-gray-600 text-xs font-bold px-2 py-1 rounded mb-1 font-mono tracking-wider">${order['Order Code']}</span>
                                <h3 class="font-bold text-navy text-lg leading-tight">${order['Customer Name']}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="inline-flex items-center gap-1 text-[10px] font-bold text-gray-500 bg-gray-50 px-2 py-0.5 rounded border border-gray-200">
                                        <i data-lucide="phone" class="w-3 h-3"></i> ${phone}
                                    </span>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-[11px] font-medium text-gray-400 mb-1">${dateStr}</div>
                                <span class="inline-block border ${badgeColor} text-[10px] uppercase tracking-wider px-2 py-1 rounded-full font-bold">${status}</span>
                            </div>
                        </div>

                        <!-- Items Box -->
                        <div class="bg-offwhite rounded-lg p-3 mb-4 flex-1 border border-gray-100">
                            <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Items Ordered</div>
                            ${itemsHtml}
                            <div class="mt-3 pt-2 border-t border-gray-200 text-xs text-gray-500 flex items-start gap-1">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 mt-0.5 flex-shrink-0"></i>
                                <span>${order['Address']}</span>
                            </div>
                        </div>

                        <!-- Total & Actions -->
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm font-bold text-gray-500">Total Amount</span>
                            <span class="font-bold text-gold text-lg">Rs. ${Number(order['Total']).toLocaleString()}</span>
                        </div>
                        
                        <div class="flex gap-2">
                            <a href="https://wa.me/977${cleanPhone}?text=Hello%20${order['Customer Name']},%20this%20is%20Koseli%20Collections.%20Your%20order%20${order['Order Code']}%20is%20now%20${status}." target="_blank" class="flex-1 bg-[#25D366]/10 text-[#25D366] border border-[#25D366]/30 py-2 rounded-lg text-sm font-bold text-center hover:bg-[#25D366] hover:text-white transition flex items-center justify-center gap-1">
                                <i data-lucide="message-circle" class="w-4 h-4"></i> Greet
                            </a>
                            <div class="flex-[2]">
                                ${actionBtn}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function updateStatus(orderCode, newStatus) {
            // Visually update immediately for speed
            const orderIndex = allOrders.findIndex(o => o['Order Code'] === orderCode);
            if (orderIndex > -1) {
                allOrders[orderIndex]['Status'] = newStatus;
                updateStats();
                renderOrders();
            }

            // Send to Google Sheets
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: "updateStatus", 
                    code: orderCode, 
                    status: newStatus 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (!data.success) {
                    alert("Failed to save status to Google Sheets. Please refresh.");
                }
            })
            .catch(err => console.error("Error updating status:", err));
        }

        function exportToExcel() {
            if (allOrders.length === 0) { alert("No orders to export."); return; }
            
            const headers = ["Order Code", "Date", "Customer Name", "Phone", "Address", "Items", "Total", "Status"];
            const data = allOrders.map(o => headers.map(h => o[h] || ''));
            
            const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Orders");
            
            const now = new Date().toISOString().slice(0,10);
            XLSX.writeFile(wb, `Koseli_Orders_${now}.xlsx`);
        }
    </script>
</body>
</html>
